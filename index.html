<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ICT/SMC Signals</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0d1117" />

<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --gold: #d4af37;
    --green: #3fb950;
    --red: #f85149;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    padding: 16px env(safe-area-inset-top, 0px) 12px 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  h1 { font-size: 1.1rem; margin: 0; color: var(--gold); }
  #status { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
  button {
    background: var(--gold);
    color: #0d1117;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 600;
    font-size: 0.85rem;
  }
  button:disabled { background: var(--border); color: var(--text-dim); }
  .btn-row { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 12px;
  }

  main { padding: 12px 16px 32px; max-width: 600px; margin: 0 auto; }

  .signal-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--text-dim);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .signal-card.buy { border-left-color: var(--green); }
  .signal-card.sell { border-left-color: var(--red); }

  .signal-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .symbol { font-weight: 700; font-size: 1rem; }
  .direction {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .direction.buy { background: rgba(63,185,80,0.15); color: var(--green); }
  .direction.sell { background: rgba(248,81,73,0.15); color: var(--red); }
  .tf { font-size: 0.75rem; color: var(--text-dim); margin-left: auto; }

  .signal-body .row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    padding: 3px 0;
    color: var(--text-dim);
  }
  .signal-body .row span:last-child { color: var(--text); font-weight: 500; }

  .signal-footer {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 8px;
    text-align: right;
  }

  .empty { text-align: center; color: var(--text-dim); margin-top: 40px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📊 ICT/SMC Signals</h1>
    <div id="status">Caricamento...</div>
  </div>
  <div class="btn-row">
    <button id="refresh-btn" class="icon-btn">↻</button>
    <button id="enable-push-btn">🔔 Attiva notifiche</button>
  </div>
</header>

<main>
  <div id="signals-container"></div>
</main>

<script src="app.js"></script>
</body>
</html>
